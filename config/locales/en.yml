            label: "Declined Bundles"
            description: "Bundles in which at least one recipient declined to sign."
            card_class: "border-red-200 bg-red-50"
            dot_class: "bg-red-500"
        quick_actions_title: "Quick Actions"
        quick_actions_description: "From the dashboard you can upload a new document, create a new bundle, or go directly to the list of documents awaiting your signature — all in one click."
