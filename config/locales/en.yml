          contracts:
            label: "My Documents"
            description: "Total number of documents uploaded to your account."
            card_class: "border-indigo-200 bg-indigo-50"
            dot_class: "bg-indigo-500"
          awaiting:
            label: "Awaiting My Signature"
            description: "A list of bundles where you are a recipient and have not signed yet, each with a Sign button. In a PRO organization it is in the personal zone, titled \"What I can sign\"."
            card_class: "border-yellow-200 bg-yellow-50"
            dot_class: "bg-yellow-500"
          sent:
            label: "Sent for Signing"
            description: "Your bundles that are waiting for signatures from recipients."
            card_class: "border-green-200 bg-green-50"
            dot_class: "bg-green-500"
