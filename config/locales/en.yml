      faq:
        subtitle: "FAQ"
        title: "Frequently asked questions"
        help_html: "Didn't find an answer? Write to us at %{email} or read the %{docs}."
        docs_link: "user guide"
        storage_basic_retention:
          one: "In the free Basic plan, documents and bundles are deleted automatically at most %{count} day after they were created."
          other: "In the free Basic plan, documents and bundles are deleted automatically at most %{count} days after they were created."
        items:
          where_stored:
            question: "Where are my documents stored?"
            answer: "We store documents in secure data storage. Only members of your organisation and the recipients you sent a document to for signing can access them. If you want full control over your documents, you can also run Autogram Portal on your own infrastructure."
          wrong_recipient:
            question: "What if I make a mistake and send a document to the wrong email address?"
            answer: "You can withdraw the signature request in the bundle detail until the recipient signs it. The link they received stops working, they can no longer sign the document, and they receive an email that the request was withdrawn. Then add the correct recipient to the bundle."
          storage:
            question: "How long are documents stored?"
            answer: "Documents and bundles of signed-in users are stored until the user deletes them. Documents and bundles of non-signed-in users are stored for at most 60 minutes after the document is uploaded for signing."
          account:
            question: "Do I need an account to sign a document?"
            answer: "No. Recipients can sign documents without registering, directly via the link they receive by email. An account is also not required if you only want to sign and validate documents yourself. An account is only needed for users who want to track document history and use advanced features."
          formats:
            question: "What file formats are supported?"
            answer: "We primarily work with PDF documents. XML documents for Slovak electronic forms, ASiC-E containers, and other common formats are also supported. Exact list: .pdf, .xml, .xdcf, .asice, .txt, .png, .jpg, .jpeg"
          signature_types:
            question: "What is the difference between a qualified electronic signature with and without a timestamp?"
            answer: "A qualified electronic signature without a timestamp is equivalent to a handwritten signature under the Slovak Civil Code. Adding a timestamp confirms the exact time of signing, so the document carries the same weight as if you had it officially certified."
          recipients_install:
            question: "Do recipients need to install anything?"
            answer: "Recipients need an application for creating qualified electronic signatures, such as Autogram Desktop, Autogram Mobile, eIdentita, Podpisuj, or other standalone applications. Depending on the exact card/ID card, using a computer and a physical card reader may be required."
          multiple_signers:
            question: "Can I send a document to multiple people for signing?"
            answer: "Yes. You can add any number of recipients. The system will track who has signed the document and notify you when all recipients have signed it. You can also define how many recipients must sign for the bundle to be considered completed."
          open_source:
            question: "Is Autogram Portal free and open-source?"
            answer: "Yes. Autogram Portal is a fully open-source project (EUPL licence) available on GitHub. You can run it on your own infrastructure. Development is supported by the NLNet organisation."
      cta:
        title: "Ready to get started?"
        subtitle: "Try Autogram Portal now or explore the source code on GitHub."
        start_signing: "Start signing documents"
        view_github: "View on GitHub"

