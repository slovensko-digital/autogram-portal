      dashboard:
        screenshot_alt: "Account overview: list of bundles awaiting my signature with a Sign button; counts of bundles, contracts, sent and declined bundles; plan usage; quick actions Upload new document and Verify signature; list of recent bundles with status, signature count, date and a View link"
        title: "Dashboard"
        intro: "After logging in, you are shown a dashboard. At the top are the bundles awaiting your signature, followed by statistics, plan usage, quick actions and recent bundles. In a PRO organization the dashboard is split into a personal zone (what you have to sign) and an overview of the organization with its name; recent bundles show whether they are personal (you sign them too) or organizational."
        stats:
          bundles:
