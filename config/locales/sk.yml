        step_1:
          title: "Nahrajte dokument"
          description: "Vyberte PDF alebo iný dokument, ktorý chcete podpísať."
        step_2:
          title: "Vyberte typ podpisu"
          description: "Zvoľte kvalifikovaný elektronický podpis s časovou pečiatkou alebo bez nej."
        step_3:
          title: "Pridajte príjemcov"
          description: "Zadajte e-mailové adresy osôb, ktoré majú dokument podpísať."
        step_4:
          title: "Odošlite a čakajte"
          description: "Odošlite balík adresátom a počkajte, kým ho podpíše požadovaný počet."
        step_5:
          title: "Stiahnite podpísaný dokument"
          description: "Po dokončení podpisovania si stiahnite hotový podpísaný dokument."
      faq:
        subtitle: "FAQ"
        title: "Časté otázky"
        help_html: "Nenašli ste odpoveď? Napíšte nám na %{email} alebo si prečítajte %{docs}."
        docs_link: "používateľskú príručku"
        storage_basic_retention:
          one: "V bezplatnom pláne Basic sa dokumenty a balíky automaticky mažú najneskôr %{count} deň po vytvorení."
          few: "V bezplatnom pláne Basic sa dokumenty a balíky automaticky mažú najneskôr %{count} dni po vytvorení."
          other: "V bezplatnom pláne Basic sa dokumenty a balíky automaticky mažú najneskôr %{count} dní po vytvorení."
        items:
          where_stored:
            question: "Kde sa ukladajú moje dokumenty?"
            answer: "Dokumenty ukladáme v zabezpečenom dátovom úložisku. Prístup k nim majú iba členovia vašej organizácie a adresáti, ktorým ste dokument poslali na podpis. Ak chcete mať dokumenty plne pod vlastnou kontrolou, môžete si Autogram Portal spustiť aj na vlastnej infraštruktúre."
          wrong_recipient:
            question: "Čo ak sa pomýlim a odošlem dokument na nesprávny e-mail?"
            answer: "Požiadavku na podpis môžete v detaile balíka stiahnuť, kým ju adresát nepodpíše. Odkaz, ktorý dostal, prestane platiť, dokument už nebude môcť podpísať a dostane e-mail o stiahnutí požiadavky. Potom do balíka pridajte správneho adresáta."
          storage:
            question: "Na aký čas sa dokumenty uchovávajú?"
            answer: "Dokumenty a balíky prihláseného používateľa sa uchovávajú, kým ich používateľ sám nezmaže. Dokumenty a balíky neprihlásených používateľov sa uchovávajú najviac 60 minút od nahratia dokumentu na podpis."
          account:
            question: "Potrebujem účet na podpisovanie dokumentu?"
            answer: "Nie. Príjemcovia môžu dokumenty podpisovať bez registrácie priamo cez odkaz, ktorý dostanú e-mailom. Rovnako nie je účet potrebný, ak chcete iba vy sami podpisovať a overovať dokumenty. Účet je potrebný len pre používateľov, ktorí chcú sledovať históriu dokumentov a využívať pokročilé funkcie."
          formats:
            question: "Aké formáty súborov sú podporované?"
            answer: "Primárne pracujeme s PDF dokumentmi. Okrem toho sú podporované XML dokumenty slovenských elektronických formulárov, ASiC-E kontajnery a ďalšie bežné formáty. Presný zoznam: .pdf, .xml, .xdcf, .asice, .txt, .png, .jpg, .jpeg"
          signature_types:
            question: "Aký je rozdiel medzi kvalifikovaným elektronickým podpisom s časovou pečiatkou a bez nej?"
            answer: "Kvalifikovaný elektronický podpis bez časovej pečiatky je podľa občianskeho zákonníka ekvivalentom vlastnoručného podpisu. Pridaním časovej pečiatky sa potvrdzuje presný čas podpisu, takže dokument má rovnakú váhu, ako keby ste ho dali úradne overiť."
          recipients_install:
            question: "Musia si príjemcovia niečo inštalovať?"
            answer: "Príjemca potrebuje aplikáciu pre vytváranie kvalifikovaných elektronických podpisov ako Autogram na počítači, Autogram v mobile, eIdentita, Podpisuj alebo iné samostatné aplikácie. V závislosti od presnej karty/občianskeho preukazu môže byť nutné použiť počítač a fyzickú čítačku kariet."
          multiple_signers:
            question: "Môžem poslať dokument na podpis viacerým ľuďom?"
            answer: "Áno. Môžete pridať ľubovoľný počet príjemcov. Systém bude sledovať, kto dokument podpísal, a notifikuje vás, keď dokument podpíšu všetci príjemcovia. Taktiež si môžete nastaviť, koľkí príjemcovia musia balík podpísať, aby bol považovaný za dokončený."
          open_source:
            question: "Je Autogram Portal zadarmo a open-source?"
            answer: "Áno. Autogram Portal je plne open-source projekt (licencia EUPL) dostupný na GitHube. Môžete si ho spustiť na vlastnej infraštruktúre. Vývoj je podporovaný organizáciou NLNet."
      cta:
        title: "Pripravení začať?"
        subtitle: "Vyskúšajte Autogram Portal teraz alebo preskúmajte zdrojový kód na GitHube."
        start_signing: "Začať podpisovať dokumenty"
        view_github: "Zobraziť na GitHube"

