      cz_eid_2018: "Podpisovať môžete, ak máte v čipe nahraný kvalifikovaný certifikát od českej certifikačnej autority (napr. PostSignum, I.CA). Potrebujete čítačku kariet pripojenú k počítaču a aplikáciu Autogram."
