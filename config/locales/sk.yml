            description: "Príjemcovia dostanú e-mailovú notifikáciu s odkazom na podpísanie. Môžete tiež skopírovať odkaz ručne."
          done:
            title: "Stiahnite podpísané dokumenty"
            description: "Po dokončení balíka si stiahnete podpísaný súbor priamo z detailu balíka."
        states_title: "Stavy balíka"
        states:
          awaiting:
            label: "Čaká na podpis"
            description: "Balík bol odoslaný príjemcom, ale ešte nie všetci podpísali."
            badge_class: "bg-yellow-100 text-yellow-800"
            dot_class: "bg-yellow-500"
          completed:
            label: "Dokončený"
            description: "Všetci požadovaní príjemcovia podpísali dokumenty v balíku."
            badge_class: "bg-green-100 text-green-800"
            dot_class: "bg-green-500"
          declined:
            label: "Odmietnutý"
            description: "Aspoň jeden príjemca odmietol podpis."
            badge_class: "bg-red-100 text-red-800"
            dot_class: "bg-red-500"
          no_recipients:
            label: "Bez príjemcov"
            description: "Balík bol vytvorený, ale zatiaľ neobsahuje žiadnych príjemcov."
            badge_class: "bg-gray-100 text-gray-600"
            dot_class: "bg-gray-400"
        signing_rules_title: "Pravidlá podpisovania"
        signing_rules:
          all:
            label: "Všetci musia podpísať"
            description: "Balík je dokončený až keď podpíšu všetci pridaní príjemcovia."
          any:
            label: "Stačí jeden podpis"
            description: "Balík je dokončený hneď ako podpíše ktorýkoľvek jeden príjemca."
          threshold:
            label: "Minimálny počet podpisov"
            description: "Môžete nastaviť presný počet príjemcov, ktorí musia podpísať, aby bol balík považovaný za dokončený."
        public_link_title: "Verejný odkaz na podpis"
        public_link_description: "Pre každý balík môžete vygenerovať verejný odkaz, ktorý umožní podpísanie komukoľvek — bez nutnosti byť pridaný ako príjemca."
      received:
        title: "Prijaté balíky"
        intro: "V sekcii \"Prijaté balíky\" nájdete všetky balíky, na ktorých podpisovanie ste boli pozvaní — či už e-mailom alebo cez verejný odkaz."
        states_title: "Vaše stavy v prijatom balíku"
        states:
          awaiting:
            label: "Čaká na podpis"
            description: "Ste pozvaní a ešte ste nepodpísali."
            badge_class: "bg-yellow-100 text-yellow-800"
            dot_class: "bg-yellow-500"
          signed:
            label: "Podpísané"
            description: "Úspešne ste podpísali dokumenty v tomto balíku."
            badge_class: "bg-green-100 text-green-800"
            dot_class: "bg-green-500"
          declined:
            label: "Odmietnuté"
            description: "Odmietli ste podpísať dokumenty v tomto balíku."
            badge_class: "bg-red-100 text-red-800"
            dot_class: "bg-red-500"
          superseded:
            label: "Nahradené"
            description: "Balík bol dokončený bez vášho podpisu — napr. na základe pravidla \"stačí jeden\"."
            badge_class: "bg-gray-100 text-gray-600"
            dot_class: "bg-gray-400"
        decline_title: "Odmietnutie podpisu"
        decline_description: "Pri podpisovaní môžete podpis odmietnuť. Odosielateľ balíka dostane e-mailovú notifikáciu o odmietnutí."
      signing:
        screenshot_alt: "Krok Vyberte podpisovú aplikáciu: hore zvolený typ občianskeho preukazu s možnosťou Zmeniť výber, pod ním voľby Autogram na počítači (vybraná), Autogram v mobile a eIdentita a tlačidlá Späť a Pokračovať na podpisovanie"
        title: "Podpisovanie dokumentov"
        intro: "Pri podpisovaní dokumentu vyberiete úroveň podpisu a formát. Následne si zvolíte podporovanú podpisovú aplikáciu."
        signature_levels_title: "Úrovne podpisu"
        signature_levels:
          baseline_b:
            label: "Bez časovej pečiatky (BASELINE_B)"
            description: "Kvalifikovaný elektronický podpis bez časovej pečiatky. Podľa Občianskeho zákonníka je ekvivalentom vlastnoručného podpisu."
          baseline_t:
            label: "S časovou pečiatkou (BASELINE_T)"
            description: "Kvalifikovaný elektronický podpis s časovou pečiatkou. De facto ekvivalent overeného podpisu. Odporúčané pre dokumenty s dlhšou platnosťou."
        formats_title: "Formáty podpisov"
        formats:
          pades:
            label: "PAdES"
            description: "Podpis vložený priamo do PDF súboru. Ideálne pre bežné PDF dokumenty — podpísaný výstup zostane .pdf."
          xades:
            label: "XAdES + ASiC-E"
            description: "Podpis pre XML dokumenty (napr. slovenské eFormuláre). Pri potrebe kontajnera môžete použiť ASiC-E výstup."
          cades:
            label: "CAdES + ASiC-E"
            description: "Podpis vytvorí obalový .p7s súbor. Pri potrebe kontajnera môžete použiť ASiC-E výstup pre ľubovoľný formát súboru."
        methods_title: "Metódy podpisovania"
        methods:
          autogram_desktop:
            label: "Autogram na počítači"
            description: "Desktopová aplikácia pre Windows, macOS a Linux, ktorá komunikuje s čipovou kartou alebo eID zariadením zapojeným do počítača."
            links:
              download:
                label: "Stiahnuť Autogram"
                url: "https://autogram.slovensko.digital"
          autogram_mobile:
            label: "Autogram v mobile (AVM)"
            description: "Mobilná aplikácia pre iOS a Android. Podpisovanie cez smartfón pomocou mobilného eID."
            links:
              info:
                label: "Viac info a stiahnutie"
                url: "https://autogram.slovensko.digital"
          eidentita:
            label: "eIdentita"
            description: "Slovenská štátna aplikácia pre mobilné podpisovanie. Dostupná na App Store a Google Play."
            links:
              ios:
                label: "Stiahnuť z App Store"
                url: "https://apps.apple.com/sk/app/eidentita/id6739350147"
              android:
                label: "Stiahnuť z Google Play"
                url: "https://play.google.com/store/apps/details?id=sk.minv.eidentita"
          podpisuj:
            label: "Podpisuj alebo iné samostatné aplikácie"
            description: "Dostupné len pri podpisovaní jednotlivých dokumentov bez časovej pečiatky a iba na počítači. Stiahnite si dokument, podpíšte ho vo vašej preferovanej aplikácii (napr. Podpisuj) priamo na počítači a podpísaný dokument nahrajte späť."
            links:
              download:
                label: "Stiahnuť Podpisuj"
                url: "https://www.podpisuj.sk/download"
        qualified_signing_title: "Kvalifikované podpisovanie — čo vás čaká"
        qualified_signing_intro: "Pred samotným podpisom vás onboarding prevedie niekoľkými kontrolami, aby ste mohli úspešne vytvoriť kvalifikovaný elektronický podpis."
        qualified_signing_checks:
