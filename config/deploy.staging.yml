servers:
  web:
    hosts:
      - dev.slovensko.digital

env:
  clear:
    RAILS_ENV: staging
    RAILS_LOG_LEVEL: info
    APP_HOST: agp.dev.slovensko.digital
    # Marks this instance as a test one: notice on pages and in emails, mail for people outside an
    # organization goes to its owners, free API; see app/lib/staging_instance.rb. Anyone may sign up
    # unless SIGNUP_ALLOWED_DOMAINS (comma-separated) is set.
    PRODUCTION_URL: https://agp.slovensko.digital
    PRICING_URL: https://sluzby.slovensko.digital/autogram-portal/cennik
    # The terms describe the test instance too (free API, redirected mail).
    TERMS_OF_SERVICE_URL: https://sluzby.slovensko.digital/autogram-portal/vseobecne-obchodne-podmienky
    PRIVACY_POLICY_URL: https://sluzby.slovensko.digital/autogram-portal/ochrana-osobnych-udajov
    AUTOGRAM_SERVICE_URL: http://autogram-portal-ag_service:7200
    REDIS_URL: redis://autogram-portal-redis:6379/0
    AVM_URL: https://autogram.slovensko.digital
    GOOD_JOB_EXECUTION_MODE: async
    MAIL_FROM: "Autogram Portal DEV <noreply@agp.dev.slovensko.digital>"
    SMTP_USERNAME: noreply@agp.dev.slovensko.digital
    SMTP_HOST: smtp.m1.websupport.sk
    SMTP_PORT: 587
    SMTP_AUTHENTICATION: login
    SMTP_ENABLE_STARTTLS_AUTO: true
    SMTP_TLS: false
    ALLOWED_METHODS: "qes,ades,visual"
    ALLOW_TEST_SIGNATURES: true
    AWS_ACCESS_KEY_ID: "<%= ENV['AWS_ACCESS_KEY_ID'] %>"
    AWS_REGION: "<%= ENV['AWS_REGION'] %>"
    AWS_SMS_ENABLED: "<%= ENV['AWS_SMS_ENABLED'] %>"
    BASIC_MAX_STORED_DOCUMENTS: 10
    BASIC_MONTHLY_SIGNATURE_REQUESTS: 10
    BASIC_MONTHLY_TIMESTAMPS: 10
    BASIC_RETENTION_DAYS: 60
    PRO_STORAGE_GB: 2
    MAX_DOCUMENT_SIZE_MB: 25
    SIGNED_HISTORY_DAYS: 60

proxy:
  host: agp.dev.slovensko.digital

volumes:
  - "autogram_portal_storage:/rails/storage"

ssh:
  user: kamal
