  securitySchemes:
    JWT:
      description: |
        JWT token must be encoded using RS256 or ES256 and client-specific key matching `sub` claim.
        API access belongs to an organization (tenant), not to an individual user: `sub` is the organization ID
        shown in the organization settings, and the token is verified with the public key stored there.
        The organization must have API access enabled. All created resources belong to that organization.
        Maximum `exp` claim duration is 15 minutes.
        `jti` claim is required. Each token is accepted only once: a request with a `jti` the organization
        has already used is rejected with 401, so create a new token for every request.
        `jti` claim must comply with regular expression: `/\A[0-9a-z\-_]{32,256}\z/i`

        Example of `header` segment:

              {
                "alg": "RS256",
              }

        (`alg` can be either `RS256` or `ES256`.)

        Example `payload` segment:

              {
                "sub": "123",
                "exp": 1543437976,
                "jti": "4dee8618-abbe-4dc3-83ba-e984d1396f9f"
              }

        Token must be present in either:
        - header `Authorization: Bearer <api-token>`
        - query parameter `?token=<api-token>`
      type: http
      scheme: bearer
      bearerFormat: JWT

    PortalJWT:
      description: |
        JWT token signed by a trusted portal instance private key.
        Required claims:
        - `iss` trusted portal issuer
        - `aud` origin portal issuer
        - `exp` no more than 5 minutes in the future
        - `jti` unique assertion identifier
        - `scope` space-separated federation scopes such as `federation.request.read` and `federation.request.claim`
      type: http
      scheme: bearer
      bearerFormat: JWT

