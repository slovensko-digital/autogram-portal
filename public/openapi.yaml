    bundle-minimal:
      summary: Minimal bundle with one document
      value:
        publiclyVisible: true
        contracts:
          - allowedMethods: [ "qes" ]
            documents:
              - filename: "contract.txt"
                content: "Sample text content"
                contentType: "text/plain"
            signatureParameters:
              format: XAdES
              container: ASiC_E

    bundle-webhook:
      summary: Webhook URL for notifications
      value:
        contracts:
          - allowedMethods: [ "qes" ]
            documents:
              - filename: "contract.txt"
                content: "Sample text content"
                contentType: "text/plain"
            signatureParameters:
              format: XAdES
              container: ASiC_E
        webhook:
          url: "https://example.com/webhook"

    target-user:
      summary: Target user for the signing process
      value:
        contracts:
          - allowedMethods: [ "qes" ]
            documents:
              - filename: "contract.txt"
                content: "Sample text content"
                contentType: "text/plain"
            signatureParameters:
              format: XAdES
              container: ASiC_E
        recipients:
          - name: "John Doe"
            email: "john.doe@example.com"

    federated-recipient:
      summary: Recipient assigned to a trusted remote portal
      value:
        contracts:
          - allowedMethods: [ "qes" ]
            documents:
              - filename: "contract.txt"
                content: "Sample text content"
                contentType: "text/plain"
            signatureParameters:
              format: XAdES
              container: ASiC_E
        recipients:
          - name: "John Doe"
            email: "john@partner.example"
            portalInstanceId: "2ad58f5f-6f56-4ab6-a6df-5b80aa6f4a25"

    federation-claim:
