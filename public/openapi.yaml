openapi: '3.1.1'

info:
  title: Autogram portal API
  version: '0.0.1'

servers:
  - url: /api/v1
  - url: https://agp.dev.slovensko.digital/api/v1

tags:
  - name: Integration
  - name: Federation

paths:
  /.well-known/autogram-portal.json:
    servers:
      - url: /
      - url: https://agp.dev.slovensko.digital
    get:
      tags:
        - Federation
      summary: Federation metadata
      description: Returns metadata that trusted peer portals use to discover federation capabilities and configure request routing.
      responses:
        "200":
          description: Federation metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederationMetadata"

  /hello:
    get:
      tags:
        - Integration
      summary: Hello world endpoint
      description: Returns a simple hello world message.
      responses:
        "200":
          description: A successful response with a hello world message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello, world!

  /hello_auth:
    get:
      tags:
        - Integration
      security:
        - JWT: []
      summary: Authenticated hello world endpoint
      description: Returns a hello message for authenticated users.
      responses:
        "200":
          description: A successful response with a hello message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello, 42!
        "401":
          description: Unauthorized access.

  /usage:
    get:
      tags:
        - Integration
      security:
        - JWT: []
      summary: Plan limits and usage
      description: |
        Returns the limits of the organization's plan and its usage in the current calendar month.
        A `null` limit means unlimited.

        - `storedDocuments` – documents (contracts) the organization keeps at once
        - `storage` – bytes of all stored documents and their signed versions
        - `signatureRequests` – documents sent for signature this month. A document counts once,
          when anyone but the user who uploaded it is asked to sign it (a recipient of its bundle
          is notified; all documents of the bundle count then) or signs it, whichever comes first.
          Documents created through the API have no such user, so they count at the first
          notification or the first signature, in a bundle or outside one. Once the limit is
          reached, signing of documents that were not counted yet cannot start.
        - `timestamps` – timestamps added this month by extending signatures, by archivation and by
          signing in Autogram v mobile with a timestamped signature level
      responses:
        "200":
          description: Limits and usage of the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "401":
          description: Unauthorized access.

  /contracts:
    post:
      tags:
        - Integration
      security:
        - JWT: []
      summary: Create a contract
      description: |
        Uploads one or more documents to be signed together. Several documents are signed into one
        ASiC-E container (XAdES or CAdES). The contract is signed at `/contracts/{id}/sign` on the portal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contract"
            examples:
              minimal-qes-pades:
                summary: Minimal QES PAdES
                value:
                  allowedMethods: [ "qes" ]
                  documents:
                    - filename: "contract.pdf"
                      content: "base64-encoded-content"
                      contentType: "application/pdf;base64"
              qes-pdf-cades-asice-ts:
                summary: QES PDF CAdES ASiC-E with timestamp
                value:
                  allowedMethods: [ "qes" ]
                  documents:
                    - filename: "contract.pdf"
                      content: "base64-encoded-content"
                      contentType: "application/pdf;base64"
                  signatureParameters:
                    format: CAdES
                    level: BASELINE_T
                    container: ASiC_E
              several-documents:
                summary: Several documents signed into one ASiC-E container
                value:
                  allowedMethods: [ "qes" ]
                  documents:
                    - filename: "contract.pdf"
                      content: "base64-encoded-content"
                      contentType: "application/pdf;base64"
                    - filename: "annex.pdf"
                      content: "base64-encoded-content"
                      contentType: "application/pdf;base64"
                  signatureParameters:
                    format: XAdES
                    level: BASELINE_B
                    container: ASiC_E
              qes-or-ades:
                summary: Qualified or advanced electronic signature
                value:
                  allowedMethods: [ "qes", "ades" ]
                  documents:
                    - filename: "contract.pdf"
                      content: "base64-encoded-content"
                      contentType: "application/pdf;base64"

      responses:
        "201":
          description: The contract was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 69393b49-c34f-438f-ad7c-4b78db3932be
        "409":
          description: Conflict - A contract with the same ID already exists.
        "422":
          description: |
            Unprocessable Entity - The request body is invalid, a document is already signed in a form
            no signature can be added to (e.g. a PDF in an enveloping CMS/CAdES signature, `.p7m`), or the
            request does not fit the limits of the organization's plan (`code: limit_exceeded`). Nothing is
            stored in that case.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrors"
                  - $ref: "#/components/schemas/LimitExceeded"

  /contracts/{id}:
    get:
      tags:
        - Integration
      security:
        - JWT: []
      summary: Get contract details
      description: Retrieves details of a specific contract by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 69393b49-c34f-438f-ad7c-4b78db3932be
          description: The unique identifier of the contract.
      responses:
        "200":
          description: A successful response with the contract details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractDetails"
        "404":
          description: Contract not found.

    delete:
      tags:
        - Integration
      security:
        - JWT: []
      summary: Delete a contract
      description: Deletes a specific contract by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 69393b49-c34f-438f-ad7c-4b78db3932be
          description: The unique identifier of the contract.
      responses:
        "204":
          description: Contract successfully deleted.
        "404":
          description: Contract not found.

  /contracts/{id}/signed_document:
    get:
      tags:
        - Integration
      security:
        - JWT: []
      summary: Get signed document
      description: Retrieves the signed document associated with a specific contract by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 69393b49-c34f-438f-ad7c-4b78db3932be
          description: The unique identifier of the contract.
      responses:
        "200":
          description: A successful response with the signed document details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedDocument"
        "404":
          description: Contract or signed document not found.

  /contracts/{id}/status:
    get:
      tags:
        - Integration
      security:
        - JWT: []
      summary: Get contract signing status
      description: Retrieves the signing status of a specific contract by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 69393b49-c34f-438f-ad7c-4b78db3932be
          description: The unique identifier of the contract.
      responses:
        "200":
          description: Pending
          headers:
            Retry-After:
              description: Indicates how long the client should wait before making a follow-up request.
              schema:
                type: integer
                example: 10
        "302":
          description: Signed. Redirects to the contract details, which include `signed_document`.
          headers:
            Location:
              description: URL of the contract details in the API.
              schema:
                type: string
                format: uri
                example: https://example.com/api/v1/contracts/69393b49-c34f-438f-ad7c-4b78db3932be
        "404":
          description: Contract not found.

  /documents/{id}:
    get:
      tags:
        - Integration
      security:
        - JWT: []
      summary: Get document details
      description: Retrieves a document of a contract by its ID (`documents[].id` in the contract details).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 35a22b52-4188-4239-907c-55decca6d3dc
          description: The unique identifier of the document.
      responses:
        "200":
          description: A successful response with the document details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetails"
        "404":
          description: Document not found.

  /bundles:
    post:
      tags:
        - Integration
      security:
        - JWT: []
      summary: Create a new signing bundle
      description: |
        Creates a new signing bundle with contracts to be signed, recipients who sign them, and other metadata.
        The bundle is signed at `/bundles/{id}/sign` on the portal: a recipient with `?recipient={uuid}`,
        anyone with the link when the bundle is `publiclyVisible` and has no recipients. Creating the bundle
        sends no email to the recipients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Bundle"
            examples:
              bundle-minimal:
                $ref: "#/components/examples/bundle-minimal"
              bundle-webhook:
                $ref: "#/components/examples/bundle-webhook"
              target-user:
                $ref: "#/components/examples/target-user"
              multiple-users-and-docs:
                $ref: "#/components/examples/multiple-users-and-docs"
              postal-signing:
                $ref: "#/components/examples/postal-signing"
      responses:
        "201":
          description: A successful response indicating the bundle was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: 69393b49-c34f-438f-ad7c-4b78db3932be
        "409":
          description: Conflict - A bundle, or a contract of the bundle, with the same ID already exists.
        "422":
          description: |
            Unprocessable Entity - The request body is invalid, a document is already signed in a form
            no signature can be added to (e.g. a PDF in an enveloping CMS/CAdES signature, `.p7m`), or the
            request does not fit the limits of the organization's plan (`code: limit_exceeded`). Nothing is
            stored in that case.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrors"
                  - $ref: "#/components/schemas/LimitExceeded"

  /bundles/{id}:
    get:
      tags:
        - Integration
      security:
        - JWT: []
      summary: Get bundle details
      description: Retrieves details of a specific bundle by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 69393b49-c34f-438f-ad7c-4b78db3932be
          description: The unique identifier of the bundle.
      responses:
        "200":
          description: A successful response with the bundle details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleDetails"
        "404":
          description: Bundle not found.

    delete:
      tags:
        - Integration
      security:
        - JWT: []
      summary: Delete a bundle
      description: Deletes a specific bundle by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 69393b49-c34f-438f-ad7c-4b78db3932be
          description: The unique identifier of the bundle.
      responses:
        "204":
          description: Bundle successfully deleted.
        "404":
          description: Bundle not found.

  /bundles/{id}/status:
    get:
      tags:
        - Integration
      security:
        - JWT: []
      summary: Get bundle signing status
      description: Retrieves the signing status of a specific bundle by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 69393b49-c34f-438f-ad7c-4b78db3932be
          description: The unique identifier of the bundle.
      responses:
        "200":
          description: Pending
          headers:
            Retry-After:
              description: Indicates how long the client should wait before making a follow-up request.
              schema:
                type: integer
                example: 10
        "302":
          description: Completed. Redirects to the bundle details, whose contracts include `signed_document`.
          headers:
            Location:
              description: URL of the bundle details in the API.
              schema:
                type: string
                format: uri
                example: https://example.com/api/v1/bundles/69393b49-c34f-438f-ad7c-4b78db3932be
        "404":
          description: Bundle not found.

  /federation/v1/requests/{id}:
    servers:
      - url: /api
      - url: https://agp.dev.slovensko.digital/api
    get:
      tags:
        - Federation
      security:
        - PortalJWT: []
      summary: Preview a federated signing request
      description: Returns request preview metadata for a federated recipient assigned to the calling trusted portal.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The recipient UUID on the origin portal.
        - name: bundleId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional bundle UUID for stronger request matching.
      responses:
        "200":
          description: Request preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: "#/components/schemas/FederationRequestPreview"
        "401":
          description: Invalid portal assertion.
        "403":
          description: Portal is not authorized for this recipient.
        "404":
          description: Recipient not found.
        "409":
          description: Request is no longer claimable.

  /federation/v1/requests/{id}/claim:
    servers:
      - url: /api
      - url: https://agp.dev.slovensko.digital/api
    post:
      tags:
        - Federation
      security:
        - PortalJWT: []
      summary: Claim a federated signing request
      description: Claims a recipient on behalf of a local user from another trusted portal and returns a short-lived origin sign URL.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The recipient UUID on the origin portal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bundleId:
                  type: string
                  format: uuid
                claimant:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    displayName:
                      type: string
                    externalUserId:
                      type: string
                  required:
                    - email
              required:
                - claimant
      responses:
        "201":
          description: Claim accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim:
                    type: object
                    properties:
                      recipientId:
                        type: string
                        format: uuid
                      claimedAt:
                        type: string
                        format: date-time
                      signUrl:
                        type: string
                        format: uri
                      bundleId:
                        type: string
                        format: uuid
                      expiresAt:
                        type: string
                        format: date-time
        "401":
          description: Invalid portal assertion.
        "403":
          description: Portal is not authorized for this recipient.
        "404":
          description: Recipient not found.
        "409":
          description: Request is no longer claimable.

  /federation/v1/request_invitations:
    servers:
      - url: /api
      - url: https://agp.dev.slovensko.digital/api
    post:
      tags:
        - Federation
      security:
        - PortalJWT: []
      summary: Push a federated signing request invitation to a trusted portal
      description: Stores or updates a pending signing invitation on the recipient home portal so it can be shown in the received-bundles experience.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invitation:
                  $ref: "#/components/schemas/FederationRequestInvitationPayload"
              required:
                - invitation
      responses:
        "201":
          description: Invitation stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation:
                    $ref: "#/components/schemas/FederationRequestInvitation"
        "401":
          description: Invalid portal assertion.

  /federation/v1/request_invitations/{recipientUuid}/withdraw:
    servers:
      - url: /api
      - url: https://agp.dev.slovensko.digital/api
    post:
      tags:
        - Federation
      security:
        - PortalJWT: []
      summary: Withdraw a previously pushed federated signing request invitation
      description: Marks an existing pushed invitation as withdrawn on the recipient home portal.
      parameters:
        - name: recipientUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The recipient UUID on the origin portal.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ signed, superseded, withdrawn ]
                  description: Optional terminal invitation status to persist on the home portal. Defaults to `withdrawn`.
      responses:
        "200":
          description: Invitation withdrawn.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation:
                    $ref: "#/components/schemas/FederationRequestInvitation"
        "401":
          description: Invalid portal assertion.
        "404":
          description: Invitation not found.
        "422":
          description: Claimant email does not match recipient.

webhooks:
  notificationWebhook:
    post:
      description: A delivery answered with a status other than 2xx (or not answered) is retried with a growing delay, 10 attempts in about 4 hours. Each attempt is signed again with its own `webhook-timestamp` and the same event can arrive more than once, so process deliveries idempotently.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandardWebhookRequestBody"

components:
  schemas:
    UsageEntry:
      type: object
      properties:
        used:
          type: integer
          example: 3
        limit:
          type: ["integer", "null"]
          description: Null means unlimited.
          example: 10
    Usage:
      type: object
      properties:
        plan:
          type: string
          enum: [basic, pro]
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        usage:
          type: object
          properties:
            storedDocuments:
              $ref: "#/components/schemas/UsageEntry"
            storage:
              $ref: "#/components/schemas/UsageEntry"
            signatureRequests:
              $ref: "#/components/schemas/UsageEntry"
            timestamps:
              $ref: "#/components/schemas/UsageEntry"
        maxDocumentBytes:
          type: ["integer", "null"]
          description: Maximum total size of the files of one document. Null means unlimited.
          example: 26214400
        retentionDays:
          type: ["integer", "null"]
          description: Documents and bundles are deleted this many days after they were created. Null means they are kept until deleted.
          example: 60
    ValidationErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    LimitExceeded:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
        code:
          type: string
          enum: [limit_exceeded]
        limit:
          type: string
          enum: [document_size, stored_documents, storage]
    Bundle:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 69393b49-c34f-438f-ad7c-4b78db3932be
          description: Unique identifier for the bundle, a UUID. If not provided, a new UUID will be generated.
        name:
          type: string
          nullable: true
          description: Optional custom name for the bundle.
        publiclyVisible:
          type: boolean
          default: false
          description: When true, the bundle sign page can be opened without an AGP recipient or AGP session. Useful for embedded third-party signing flows.
        signingRule:
          type: string
          enum:
            - all
            - any
            - threshold
          default: all
          description: When the bundle is completed - once all recipients sign, once any of them signs, or once `requiredSignatures` of them sign.
        requiredSignatures:
          type: integer
          minimum: 1
          description: Number of recipients who must sign. Required when `signingRule` is `threshold`.
        authorNotificationsEnabled:
          type: boolean
          default: false
          description: When true and the bundle has no webhook, the organization's owners get email notifications about the signing of the bundle.
        contracts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Contract"
        postalAddress:
          $ref: "#/components/schemas/PostalAddress"
        webhook:
          $ref: "#/components/schemas/Webhook"
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/Recipient"
      required:
        - contracts

    Contract:
      type: object
      properties:
        id:
          type: string
          example: 69393b49-c34f-438f-ad7c-4b78db3932be
          description: Unique identifier for the contract. If not provided, a new UUID will be generated.
        allowedMethods:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SignatureMethod"
        documents:
          type: array
          minItems: 1
          description: Several documents are signed together into one ASiC-E container (XAdES or CAdES).
          items:
            $ref: "#/components/schemas/Document"
        signatureParameters:
          $ref: "#/components/schemas/SignatureParameters"
      required:
        - allowedMethods
        - documents

    BundleDetails:
      type: object
      description: A bundle as the API returns it. Unlike requests, responses use snake_case keys.
      properties:
        id:
          type: string
          format: uuid
          example: 69393b49-c34f-438f-ad7c-4b78db3932be
        name:
          type:
            - string
            - "null"
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ContractDetails"
        recipients:
          type: array
          description: Present when the bundle has recipients.
          items:
            type: object
            properties:
              name:
                type:
                  - string
                  - "null"
              email:
                type:
                  - string
                  - "null"
              uuid:
                type: string
                format: uuid
        webhook:
          type: object
          description: Present when the bundle has a webhook.
          properties:
            url:
              type: string
              format: uri
            method:
              type: string
              enum:
                - standard
                - get
        postal_address:
          type: object
          description: Present when the bundle has a postal address.
          properties:
            address:
              type: string
            recipient_name:
              type: string
        created_at:
          type: string
          format: date-time

    ContractDetails:
      type: object
      description: A contract as the API returns it. Unlike requests, responses use snake_case keys.
      properties:
        id:
          type: string
          example: 69393b49-c34f-438f-ad7c-4b78db3932be
        allowed_methods:
          type: array
          items:
            $ref: "#/components/schemas/SignatureMethod"
        signature_parameters:
          type: object
          properties:
            format:
              type:
                - string
                - "null"
              example: XAdES
            level:
              type: string
              example: BASELINE_B
            container:
              type:
                - string
                - "null"
              example: ASiC_E
            en319132:
              type: boolean
            add_content_timestamp:
              type: boolean
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentDetails"
        signed_document:
          description: Present once the contract is signed.
          $ref: "#/components/schemas/SignedDocument"

    DocumentDetails:
      type: object
      properties:
        id:
          type: string
          example: 35a22b52-4188-4239-907c-55decca6d3dc
        filename:
          type: string
          example: contract.pdf
        content_type:
          type: string
          example: application/pdf
        download_url:
          type: string
          format: uri
          example: https://example.com/rails/active_storage/blobs/redirect/abc/contract.pdf
        xdc_parameters:
          type: object
          description: The `xdcParameters` of the document with snake_case keys (e.g. `fs_form_identifier`), null when not set.

    SignedDocument:
      type: object
      properties:
        download_url:
          type: string
          format: uri
          example: https://example.com/signed_document.pdf
        content_type:
          type: string
          example: application/pdf
        filename:
          type: string
          example: signed_document.pdf
        file_size:
          type: integer
          example: 204800
        checksum:
          type: string
          example: abcdef1234567890abcdef1234567890abcdef1234567890
        signed_at:
          type: string
          format: date-time
          example: '2023-10-01T12:34:56Z'

    PostalAddress:
      type: object
      properties:
        address:
          type: string
          example: 123 Main St, 81103 Bratislava, Slovakia
        recipientName:
          type: string
          example: Company Name

    Webhook:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: https://example.com/webhook
          description: URL to which webhook notifications will be sent.
        method:
          type: string
          enum:
            - standard
            - get
          example: standard
          description: Type of webhook to use. Defaults to "standard" as described in Standard Webhooks. "get" method will send a GET request to the URL without a body.

    SignatureMethod:
      type: string
      description: |
        `qes` signs with a qualified signature through the integrated signing apps (Autogram, Autogram v mobile, eIdentita).
        `standalone_qes` additionally lets the signer download the document, sign it with a qualified signature in a standalone
        desktop application (e.g. Podpisuj) and upload it back. Neither implies the other.
        Which methods are accepted depends on the configuration of the portal, by default `qes`, `standalone_qes`
        and `ades`; other values are rejected with 422.
      enum:
        - qes
        - standalone_qes
        - ades
        - visual
        - scan
        - paper

    Document:
      type: object
      properties:
        filename:
          type: string
          example: contract.pdf
        content:
          type: string
          description: Content of the file, Base64-encoded when `contentType` says so, otherwise plain text.
        contentType:
          type: string
          example: application/pdf;base64
          description: MIME type of the file. Add `;base64` when `content` is Base64-encoded.
        url:
          type: string
          example: https://example.com/doc-1.pdf
          description: Not supported yet. A document without `content` is left out of the contract.
        hash:
          type: string
          example: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
          description: SHA-256 hash of the file at `url`. Not supported yet, like `url`.
        xdcParameters:
          $ref: "#/components/schemas/XdcParameters"
      required:
        - content

    Recipient:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: john.doe@example.com
          format: email
          description: Optional. A recipient without an email opens the bundle only through its link with `uuid`.
        mobilePhone:
          type: string
          example: "+421901234567"
          description: Recipient mobile number in E.164 format. Needed for evidence-based AdES signing with SMS verification.
        phoneNumber:
          type: string
          example: "+421901234567"
          description: Alias for `mobilePhone` accepted for compatibility with external integrators.
        locale:
          type: string
          default: sk
          description: Preferred locale for the recipient. Defaults to "sk".
        uuid:
          type: string
          format: uuid
          example: 69393b49-c34f-438f-ad7c-4b78db3932be
          description: Unique identifier for the recipient. If not provided, a new UUID will be generated.
        portalInstanceId:
          type: string
          format: uuid
          example: 2ad58f5f-6f56-4ab6-a6df-5b80aa6f4a25
          description: Optional trusted portal instance identifier. When provided, the recipient is treated as federated and is expected to open the request through that remote portal instance.

    SignatureParameters:
      type: object
      description: Parameters of the qualified electronic signature.
      properties:
        level:
          type: string
          description: Signature level.
          default: BASELINE_B
          example: BASELINE_B
          enum:
            - BASELINE_B
            - BASELINE_T
            - BASELINE_LT
            - BASELINE_LTA

        format:
          type: string
          description: Signature form. Defaults to PAdES for a single PDF file, XAdES otherwise. Several documents can be signed only with XAdES or CAdES.
          example: XAdES
          enum:
            - XAdES
            - CAdES
            - PAdES

        container:
          type: string
          description: Signature container. XAdES and CAdES signatures are always in an ASiC-E container, which is set when missing; PAdES signatures have no container.
          example: ASiC_E
          enum:
            - ASiC_E

        en319132:
          type: boolean
          default: false
          description: Stored and returned in the contract details, but not applied to the signature yet.

        addContentTimestamp:
          type: boolean
          default: false
          description: Stored and returned in the contract details, but not applied to the signature yet.

    XdcParameters:
      type: object
      description: XML Datacontainer EForm parameters
      properties:
        autoLoadEform:
          type: boolean
          default: false
          description:
            Try to find XSD and XSLT for a given eForm and load them automatically. Useful for visualizing and signing eForms.
            If true, schema, transformation, conatinerXmlns, container, packaging, and identifier parameters are ignored.
            If resources are not found, the response is 422.
            If provided file is an ASiC_E container conatining XML Datacontainer or it is an XML Datacontainer itself, XSLT found is used for visualiztion of signing file. Also, XSD and XSLT hashes are compared with hashes of XSD and XSLT found in XML Data Container EForm. If they differ, the response is 422.
            If the provided file is an XML file, Autogram will try to parse xmlns from root element and find resources based on its value.
            If successful, XML Datacontainer with xmls="http://data.gov.sk/def/container/xmldatacontainer+xml/1.1" is created, the file is validated against the XSD and visualized using the XSLT. If XSD validation fails, the response is 422.
            The XSLT transformation is found based on transformationLanguage (defaults to user preferred), transformationMediaDestinationTypeDescription (default XHTML, then HTML, then TXT), and transformationTargetEnvironment.
            If multiple transformations meet the criteria, the first one found is used.

        containerXmlns:
          type: string
          enum:
            - http://data.gov.sk/def/container/xmldatacontainer+xml/1.1
          example: http://data.gov.sk/def/container/xmldatacontainer+xml/1.1
          description: XML namespace for the XML Datacontainer. Specifies if xmldatacontainer should be created from XML. Doesn't create xmldatacontainer if payloadMimeType is application/vnd.gov.sk.xmldatacontainer+xml already. Accepts http://data.gov.sk/def/container/xmldatacontainer+xml/1.1 only. Defaults to null. Is ignored with autoLoadEform true.

        embedUsedSchemas:
          type: boolean
          example: false
          description: When creating XML Datacontainer, parameter indicates whether to embed XSD and XML or reference them. Practically this should be only used for ORSR EForms in which case (when identifier contains "justice.gov.sk/Forms") this parameter is overridden to true.

        identifier:
          type: string
          example: https://data.gov.sk/id/egov/eform/App.GeneralAgenda/1.9
          description: Optional identifier of the file template. Required if containerXmlns is http://data.gov.sk/def/container/xmldatacontainer+xml/1.1. Defaults to null. Is ignored with autoLoadEform true.

        fsFormIdentifier:
          type: string
          example: "792_772"
          description: Optional specific identifier for financnasprava.sk EForms. For example, 792_772 is an identifier of "Danove priznanie - riadne".

        schema:
          type: string
          example: '<?xml version="1.0"?><xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema"><xs:element name="File"><xs:complexType><xs:sequence><xs:element name="Title" type="xs:string" /></xs:sequence></xs:complexType></xs:element></xs:schema>'
          description: Optional XML schema used to validate the signing file and to compute digest used in "UsedXSDReference" in "DigestValue" attribute inside created XML Datacontainer. Format (plaintext or base64) is dictated by `payloadMimeType`. Is ignored with autoLoadEform true.

        schemaIdentifier:
          type: string
          example: http://schemas.gov.sk/form/App.GeneralAgenda/1.9/form.xsd
          description: Optional identifier of the XML schema. The value is used in "UsedXSDReference" field inside created XML Datacontainer. If provided with autoLoadEform true, Autogram will try to find such schema. Default value is "http://schemas.gov.sk/form/<form-idnetifier>/<version>/form.xsd".

        schemaMimeType:
          type: string
          example: application/xml
          description: Optional MIME type of the XML schema. Defaults to application/xml.

        transformation:
          type: string
          example: '<?xml version="1.0"?><xsl:stylesheet version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform"><xsl:template match = "/"><h1><xsl:value-of select="/File/Title"/></h1></xsl:template></xsl:stylesheet>'
          description: Optional XML transformation used to present the signing file to user and to compute digest used in "UsedPresentationSchemaReference" in "DigestValue" attribute inside created XML Datacontainer. Format (plaintext or base64) is dictated by `payloadMimeType`. Is ignored with autoLoadEform true.

        transformationIdentifier:
          type: string
          example: http://schemas.gov.sk/form/App.GeneralAgenda/1.9/form.xslt
          description: Optional identifier of the XML transformation. If provided with autoLoadEform true, Autogram will try to find such transformation. Default value is "http://schemas.gov.sk/form/<form-idnetifier>/<version>/form.xslt".

        transformationLanguage:
          type: string
          example: sk
          description: Optional language of the XML transformation. If autoLoadEform is true, Autogram will try to find signing XSLT with this language. Otherwise transformation must be provided. Default value is user preferred or "sk".

        transformationMediaDestinationTypeDescription:
          type: string
          enum:
            - XHTML
            - HTML
            - TXT
          example: HTML
          description: Optional media destination type description of the XML transformation. If autoLoadEform is true, Autogram will try to find signing XSLT with this type. Otherwise transformation must be provided. Overrides value of the output method in provided or auto-loaded transformation which is used by default.

        transformationTargetEnvironment:
          type: string
          example: example-value
          description: Optional target environment of the XML transformation. If autoLoadEform is true, Autogram will try to find signing XSLT with this target. Otherwise transformation must be provided. Null and not used by default.

    StandardWebhookRequestBody:
